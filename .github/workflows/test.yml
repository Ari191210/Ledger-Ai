name: test

# The repo had 94 passing tests and nothing that ran them. The three existing
# workflows are cron jobs (notifications, score snapshots, the agent), so a
# broken score engine or an illegible workspace could reach production green.
#
# Deliberately no `next build` step here: the build needs the full production
# env (Supabase, Stripe, Sentry, Resend) and Vercel already runs it on every
# push. Duplicating it in CI would mean either leaking those secrets into
# Actions or watching the job fail for reasons that have nothing to do with the
# commit. Typecheck and tests need neither.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

name: migration-gate

# ═══════════════════════════════════════════════════════════════════════════
# M1-2 — the CI gate for schema drift.
#
# Architecture T1: "An append-only event store cannot tolerate schema drift —
# a missing column silently loses data permanently." Finding A.5.a: migration
# 004's own header records five tables absent from production while code
# depended on them, and whether 004-008 are applied is UNVERIFIABLE from the
# repository. This workflow is what makes it verifiable, on every push.
#
# TWO JOBS, ON PURPOSE:
#
#   structure — repo-only. No secrets, no network. Catches duplicate version
#               numbers, malformed filenames and empty migrations. Cheap, and
#               it can never be blocked on infrastructure.
#   ledger    — reads public.migration_ledger() from the target database and
#               fails on any repo migration that is unapplied, on any applied
#               migration whose file was edited since, and on any recorded
#               version the repo no longer contains.
#
# ═══ THIS JOB IS EXPECTED TO BE RED UNTIL TWO THINGS ARE DONE ═══════════════
#
#   1. supabase/migrations/009_migration_ledger.sql is applied to production
#      (Supabase -> SQL Editor, paste and Run).
#   2. SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are added as repository
#      secrets (Settings -> Secrets and variables -> Actions).
#
# The `ledger` job fails rather than skips when those are missing. That is
# deliberate and is the whole point of M1: "we cannot read the applied set" is
# the T1 condition itself, and a gate that quietly passes in that state would
# be a green light for the exact failure it exists to prevent. A skipped gate
# is not a gate.
#
# The existing `test` workflow is untouched, so typecheck and tests keep
# reporting independently of this.
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  structure:
    name: migration structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # No `npm ci` — the checker imports nothing outside node: builtins, so
      # the structural half of the gate stays green even if the lockfile is
      # mid-change.
      - name: Structure only (no database)
        run: node scripts/check-migrations.mjs --structure-only

      - name: Gate logic tests
        run: |
          npm ci
          node --test tests/migration-ledger.test.mjs

  ledger:
    name: applied-migration ledger
    runs-on: ubuntu-latest
    needs: structure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Compare repo migrations against the applied ledger
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-migrations.mjs
